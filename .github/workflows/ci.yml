name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未跑完的任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试全部离线，这里给的是占位值，避免代码里对空 Key 的分支影响用例
  MODEL_PROVIDER: openai_compatible
  MODEL_NAME: ci-placeholder
  MODEL_API_KEY: ci-placeholder
  MODEL_BASE_URL: http://127.0.0.1:9
  STORAGE_BACKEND: memory

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: mypy
        run: uv run --frozen mypy app evals

  eval-harness:
    name: Eval harness (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      # 只验证评测框架本身（脚本化模型、离线）。真模型的评测要花钱且会随模型
      # 版本漂移，不适合卡在每次提交上——那是发版前或调完 prompt 之后才跑的。
      - name: Self-test eval harness
        run: uv run --frozen python -m evals.run --self-test --fail-under 1.0 --out eval-report.md
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
          if-no-files-found: ignore

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ocean-travel-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name api \
            -e MODEL_NAME=ci-placeholder \
            -e MODEL_API_KEY=ci-placeholder \
            -e MODEL_BASE_URL=http://127.0.0.1:9 \
            -e STORAGE_BACKEND=memory \
            -p 8000:8000 ocean-travel-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs api
          exit 1
